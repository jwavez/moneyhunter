name: moneyhunter-scan
# GitHub cron is a best-effort watchdog. The free server-side environment wait
# timer + repository-scoped ephemeral GITHUB_TOKEN drives the normal scan chain.
on:
  schedule:
    - cron: "13,43 * * * *"  # off the start-of-hour rush; target 30 minutes, not guaranteed
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Disable outbound Discord delivery (artifact only unless publish_state is explicitly enabled)"
        type: boolean
        default: true
      publish_state:
        description: "Publish genuine no-send scan observations without acknowledging alerts"
        type: boolean
        default: false
      keep_running:
        description: "Continue normal autonomous scans after the 30-minute server-side wait"
        type: boolean
        default: false
      cadence_probe:
        description: "One bounded automatic no-send successor after the 1-minute acceptance timer"
        type: boolean
        default: false
      parent_run_id:
        description: "Automatic successor provenance; no credentials or personal data"
        type: string
        default: ""
permissions:
  contents: write   # public operational state branch only
jobs:
  scan:
    if: ${{ vars.MH_SCANNER_PAUSED != '1' }}
    concurrency: { group: moneyhunter-scan, cancel-in-progress: false }
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Restore public operational state (never personal ledger)
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin state > /tmp/mh-state-ref; then
            git fetch origin state --depth 1
            for f in seen.json prices.json scan_state.json review_queue.json; do
              if git cat-file -e "origin/state:$f" 2>/dev/null; then
                git show "origin/state:$f" > "data/$f"
              fi
            done
          else
            status=$?
            if [ "$status" -ne 2 ]; then echo "::error::Cannot check state branch"; exit "$status"; fi
            echo "::notice::First run: state branch absent"
          fi
      - name: Validate offline before scanning
        env: { MONEYHUNTER_DISABLE_SEND: "1", MONEYHUNTER_FORCE_STATUS: "1" }
        run: python -m unittest discover -s tests -v
      - name: Read typed private tier index only (safe starter fallback)
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run || inputs.publish_state }}
        env:
          MH_PRIVATE_TOKEN: ${{ secrets.MH_PRIVATE_TOKEN }}
        run: python -m moneyhunter.tier_sync
      - name: Scan (manual defaults no-send), export honest public evidence
        env:
          MH_PARENT_RUN_ID: ${{ inputs.parent_run_id }}
          MH_PUBLISH_STATE: ${{ inputs.publish_state && '1' || '0' }}
          MONEYHUNTER_COMMUNITY: "1"
          MONEYHUNTER_CAPTURE_URL: "https://moneyhunter-bot.moneyhunter.workers.dev/api/research-capture"
          MONEYHUNTER_DISABLE_SEND: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          MONEYHUNTER_DISCORD_WEBHOOK: ${{ secrets.MONEYHUNTER_DISCORD_WEBHOOK }}
          MONEYHUNTER_WEBHOOKS: ${{ secrets.MONEYHUNTER_WEBHOOKS }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          rm -f public/deals.json
          if [ "$MONEYHUNTER_DISABLE_SEND" = "1" ] && [ "$MH_PUBLISH_STATE" = "1" ]; then
            python -m moneyhunter.cli scan --no-send --max-posts 0 --export public/deals.json
          elif [ "$MONEYHUNTER_DISABLE_SEND" = "1" ]; then
            python -m moneyhunter.cli scan --dry-run --max-posts 0 --export public/deals.json
          else
            python -m moneyhunter.cli scan --max-posts 5 --export public/deals.json
          fi
      - name: Write public scan health to job summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('public/deals.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              if not p.exists():
                  out.write('Scan did not produce a new export. Inspect failed steps; previous state retained.\n')
              else:
                  d = json.loads(p.read_text()); s = d['stats']
                  out.write(f"## Scan {d['generated_utc']} (UTC)\n")
                  out.write(f"New {s['new']} / rescanned {s['rescanned']}; sold-valued {s['sold_valued']}; reference-only {s['reference_only']}; A {s['A']} / B {s['B']}\n\n")
                  out.write(f"Previous-success gap: {s['gap_minutes']} minutes. Cron may be delayed/dropped.\n\n")
                  for error in s['errors']: out.write('- ' + error + '\n')
          PY
      - name: Keep manual no-send research export as artifact only
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: moneyhunter-no-send-research
          path: |
            public/deals.json
            tools_diagnostic.json
            tools_detail_diagnostic.json
            tools_slot_diagnostic.json
          if-no-files-found: warn
          retention-days: 3
      - name: Publish public state with normal fast-forward history (no force push)
        if: ${{ success() && (github.event_name != 'workflow_dispatch' || !inputs.dry_run || inputs.publish_state) }}
        run: |
          set -euo pipefail
          mkdir /tmp/mh-state
          git -C /tmp/mh-state init -q
          if [ -s /tmp/mh-state-ref ]; then
            git -C /tmp/mh-state fetch "$GITHUB_WORKSPACE" refs/remotes/origin/state --depth 1
            git -C /tmp/mh-state checkout --detach FETCH_HEAD
          fi
          cp data/seen.json data/prices.json data/scan_state.json data/review_queue.json data/comps.csv data/evidence.json public/deals.json /tmp/mh-state/
          git -C /tmp/mh-state add seen.json prices.json scan_state.json review_queue.json comps.csv evidence.json deals.json
          if git -C /tmp/mh-state diff --cached --quiet; then exit 0; fi
          git -C /tmp/mh-state -c user.name="moneyhunter-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "public scan state $(date -u +%FT%TZ)"
          # Push through checkout's configured credential helper; token never appears in command arguments.
          git fetch /tmp/mh-state HEAD:refs/moneyhunter-state
          git push origin refs/moneyhunter-state:refs/heads/state

  cadence:
    name: Queue next scan (server-side delay; no idle runner)
    needs: scan
    if: >-
      ${{ always() && !cancelled() && github.repository == 'jwavez/moneyhunter' &&
          github.ref == 'refs/heads/main' && vars.MH_SCANNER_PAUSED != '1' &&
          (github.event_name == 'schedule' || inputs.keep_running || inputs.cadence_probe) }}
    # Waiting is managed by GitHub, not an allocated runner, polling loop or box daemon.
    # A watchdog replaces the previous delayed successor, avoiding forks.
    concurrency: { group: "${{ inputs.cadence_probe && 'moneyhunter-cadence-probe' || 'moneyhunter-cadence' }}", cancel-in-progress: true }
    environment: ${{ inputs.cadence_probe && 'moneyhunter-cadence-probe' || 'moneyhunter-cadence' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: { contents: read, actions: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Dispatch bounded successor using native short-lived repository token
        env:
          GH_TOKEN: ${{ github.token }}
          MH_CADENCE_PROBE: ${{ inputs.cadence_probe && '1' || '0' }}
        run: python -m moneyhunter.cadence
