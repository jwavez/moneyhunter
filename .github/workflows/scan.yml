name: moneyhunter-scan
# Public repo: standard GitHub-hosted runners are free and unlimited (docs.github.com, checked 2 Nov 2026).
# Scheduled runs can be delayed by GitHub; every 30 min is best effort.
on:
  schedule:
    - cron: "7,37 * * * *"        # every 30 min, 24/7 (off the :00 rush)
  workflow_dispatch: {}           # used by the Discord /scan command
permissions:
  contents: write                 # push state branch
  actions: write                  # keepalive re-enable
concurrency: { group: moneyhunter-scan, cancel-in-progress: false }
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Restore state (seen.json) from the 'state' branch
        run: |
          git fetch origin state --depth 1 || true
          git show origin/state:seen.json > data/seen.json 2>/dev/null || echo "[]" > data/seen.json
          git show origin/state:prices.json > data/prices.json 2>/dev/null || echo "{}" > data/prices.json
      - name: Scan, post, export
        env:
          MONEYHUNTER_COMMUNITY: "1"   # public rule set; no personal bankroll in the cloud
          MONEYHUNTER_DISCORD_WEBHOOK: ${{ secrets.MONEYHUNTER_DISCORD_WEBHOOK }}
          MONEYHUNTER_WEBHOOKS: ${{ secrets.MONEYHUNTER_WEBHOOKS }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: python -m moneyhunter.cli scan --max-posts 5 --export public/deals.json
      - name: Publish state branch (deals.json, seen.json, comps.csv) as one rewritten commit
        if: always()
        run: |
          mkdir -p /tmp/state && cp data/seen.json data/prices.json data/comps.csv /tmp/state/ && cp public/deals.json /tmp/state/ 2>/dev/null || true
          cd /tmp/state && git init -q -b state && git add -A
          git -c user.name="moneyhunter-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "state $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" state
      # Public repos: scheduled workflows auto-disable after 60 days with no repository activity.
      # This calls GitHub's documented "enable workflow" API when main has had no commit for 45+ days.
      - name: Keepalive (re-enable workflow if main is idle 45+ days)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          last=$(gh api repos/${{ github.repository }}/commits/main --jq .commit.committer.date)
          age=$(( ( $(date +%s) - $(date -d "$last" +%s) ) / 86400 ))
          echo "main last commit $age days ago"
          if [ "$age" -ge 45 ]; then gh api -X PUT repos/${{ github.repository }}/actions/workflows/scan.yml/enable && echo re-enabled; fi
