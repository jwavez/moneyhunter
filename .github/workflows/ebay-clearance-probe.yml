name: ebay-clearance-probe
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Seed browse_usage from state branch
        run: |
          set -euo pipefail
          echo '{"browse_usage":{}}' > /tmp/scan_state_seed.json
          if git ls-remote --exit-code --heads origin state >/dev/null 2>&1; then
            git fetch origin state --depth 1
            if git cat-file -e origin/state:scan_state.json 2>/dev/null; then
              git show origin/state:scan_state.json | python3 -c 'import json,sys; from pathlib import Path; d=json.load(sys.stdin); Path("/tmp/scan_state_seed.json").write_text(json.dumps({"browse_usage": d.get("browse_usage") or {}})); print("seeded", d.get("browse_usage",{}).get("calls"))'
            fi
          fi
      - name: Run Currys clearance probe
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          SCAN_STATE_PATH: /tmp/scan_state_seed.json
          PROBE_OUT: ${{ github.workspace }}/ebay_clearance_probe.json
        run: PYTHONPATH=. python scripts/ebay_clearance_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: ebay-clearance-probe
          path: ebay_clearance_probe.json
          retention-days: 7
